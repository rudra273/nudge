# Run Nudge on GitHub Actions — no server needed.
#
# Setup (in your own fork / private copy of this repo):
#   1. Settings → Secrets and variables → Actions → Secrets:
#        TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#        optional AI (any one): OPENAI_API_KEY, GEMINI_API_KEY, ANTHROPIC_API_KEY
#   2. Settings → Secrets and variables → Actions → Variables:
#        NUDGE_ENABLED = true
#   3. Commit a watches.yaml (see examples/watches.yaml) or add watches by messaging your bot.
#
# Each run stays up for ~8 minutes (--listen): it answers Telegram, runs due checks, keeps runtime state in the
# Actions cache, and commits watches.yaml back only when watches were added/changed.
#
# Note: BookMyShow usually blocks GitHub's datacenter IPs. Amul, District and most sites work fine;
# for BookMyShow, run Nudge on a home machine / Raspberry Pi instead.
name: nudge

on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 min (GitHub minimum), off the :00 rush; runs may still be delayed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nudge
  cancel-in-progress: false

jobs:
  check:
    if: vars.NUDGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .nudge-state.json
          key: nudge-state-${{ github.run_id }}
          restore-keys: nudge-state-

      - name: Run checks
        # Stay up for 8 minutes: checks run on their own schedule (District movies every 2m) and bot
        # replies/buttons are answered within seconds. Trigger every 10m (or more often: runs queue).
        run: nudge run --once --listen 8m --grace 2m
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NUDGE_LLM_PROVIDER: ${{ vars.NUDGE_LLM_PROVIDER }}
          NUDGE_LLM_MODEL: ${{ vars.NUDGE_LLM_MODEL }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .nudge-state.json
          key: nudge-state-${{ github.run_id }}

      - name: Commit watch changes
        run: |
          if [ -n "$(git status --porcelain watches.yaml)" ]; then
            git config user.name "nudge-bot"
            git config user.email "nudge-bot@users.noreply.github.com"
            git add watches.yaml
            git commit -m "nudge: update watches"
            git pull --rebase --autostash   # runs are long now; someone may have pushed meanwhile
            git push
          fi
